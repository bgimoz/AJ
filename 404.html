<!DOCTYPE html>
<html lang="pt-MZ">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Página não encontrada — AJ Serviços LDA</title>
<link rel="icon" type="image/png" href="/logo-aj.png">
<style>
  :root{--ink:#0B2630;--paper:#FAFCFD;--accent:#0BA5C7;--muted:#5C5F66}
  @media (prefers-color-scheme:dark){:root{--ink:#EAF6F8;--paper:#081318;--accent:#4FD8EF;--muted:#A0A4AD}}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:var(--paper);color:var(--ink);font-family:"Inter Tight",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;line-height:1.5}
  main{max-width:460px}
  img{width:56px;height:56px;border-radius:12px}
  h1{font-size:clamp(28px,6vw,40px);margin:20px 0 8px;line-height:1.15}
  p{margin:0 0 24px;color:var(--muted)}
  a{display:inline-block;padding:12px 22px;border-radius:999px;background:var(--accent);color:#04161b;font-weight:600;text-decoration:none}
  a:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
</style>
</head>
<body>
<main>
  <img src="/logo-aj.png" alt="Logótipo da AJ Serviços LDA">
  <h1>Esta página não existe</h1>
  <p>O endereço pode estar errado ou a página foi movida. Volte ao início para pedir uma cotação ou acompanhar o seu processo.</p>
  <a href="/">Voltar ao início</a>
</main>
</body>
</html>
